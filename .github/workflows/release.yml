name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      - name: Check that the tag is the version of the manifest
        run: test "${VERSION#v}" = "$(node -p 'require("./manifest.json").version')"

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run package

      - name: Archive the source code
        run: git archive --format=zip -o "web-ext-artifacts/source-${VERSION#v}.zip" HEAD

      - name: Create the GitHub release
        run: gh release create "$VERSION" web-ext-artifacts/*.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist
            web-ext-artifacts

  firefox:
    needs: build
    runs-on: ubuntu-latest
    env:
      WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: release

      # Skipped until the AMO secrets exist, as the first version is submitted by hand.
      - name: Publish on Firefox Add-ons
        if: env.WEB_EXT_API_KEY != ''
        run: npx web-ext sign --channel=listed --upload-source-code="web-ext-artifacts/source-${VERSION#v}.zip" --approval-timeout=0

  chrome:
    needs: build
    runs-on: ubuntu-latest
    env:
      CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release

      - name: Authenticate to the Chrome Web Store
        id: google
        if: env.CWS_SERVICE_ACCOUNT_KEY != ''
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Publish on the Chrome Web Store
        if: env.CWS_SERVICE_ACCOUNT_KEY != ''
        env:
          TOKEN: ${{ steps.google.outputs.access_token }}
        run: |
          item="publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID"
          state=$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -T "web-ext-artifacts/improved_42_attendance-${VERSION#v}.zip" "https://chromewebstore.googleapis.com/upload/v2/$item:upload" | jq -r .uploadState)
          while [ "$state" = IN_PROGRESS ]; do
            sleep 5
            state=$(curl -fsS -H "Authorization: Bearer $TOKEN" "https://chromewebstore.googleapis.com/v2/$item:fetchStatus" | jq -r .lastAsyncUploadState)
          done
          test "$state" = SUCCEEDED
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" "https://chromewebstore.googleapis.com/v2/$item:publish"
